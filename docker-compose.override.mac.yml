version: '3.7'
services:
  caddy:
    volumes:
      - ./sourcegraph-data/caddy:/etc/caddy
  gitserver-0:
    volumes:
      - ./sourcegraph-data/gitserver-0:/data/repos
  pgsql:
    volumes:
      - ./sourcegraph-data/pgsql:/var/lib/postgresql/data
  codeintel-db:
    volumes:
      - ./sourcegraph-data/codeintel-db:/var/lib/postgresql/data
  codeinsights-db:
    volumes:
      - ./sourcegraph-data/codeinsights-db:/var/lib/postgresql/data
  redis-cache:
    volumes:
      - ./sourcegraph-data/redis-cache:/redis-data
  redis-store:
    volumes:
      - ./sourcegraph-data/redis-store:/redis-data
  blobstore:
    volumes:
      - ./sourcegraph-data/blobstore:/data
  zoekt-indexserver-0:
    volumes:
      - ./sourcegraph-data/zoekt:/data/index
  zoekt-webserver-0:
    volumes:
      - ./sourcegraph-data/zoekt:/data/index
  prometheus:
    volumes:
      - ./sourcegraph-data/prometheus:/prometheus
      - ./sourcegraph-data/prometheus/add_ons:/sg_prometheus_add_ons
    ports:
      - "9099:9090"
  grafana:
    volumes:
      - ./sourcegraph-data/grafana:/var/lib/grafana
      - ./sourcegraph-data/grafana/datasources:/sg_config_grafana/provisioning/datasources
      - ./sourcegraph-data/grafana/dashboards:/sg_grafana_additional_dashboards
  otel-collector:
    volumes:
      - ./sourcegraph-data/otel-collector/config.yaml:/etc/otel-collector/config.yaml

volumes:
  codeinsights-db:
    driver: local
    driver_opts:
      type: none
      device: ./sourcegraph-data/codeinsights-db
      o: bind
